# Supabase CLI config for the Stadsvandring community-tips backend.
# Local dev:  supabase start && supabase db reset   (applies migrations)
# Hosted:     supabase link --project-ref <ref> && supabase db push
project_id = "stadsvandring"

[api]
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 15

[studio]
port = 55323

[inbucket]
port = 55324

[analytics]
enabled = false

[auth]
# Site URL + redirects för PWA:n. site_url pekar på /karta, inte på roten:
# index.html laddar bara webbsida.js och har ingen Supabase-klient, så en token i
# URL:en hade legat kvar okonsumerad och inloggningen tystnat utan felmeddelande.
# OBS: den här filen styr bara LOKAL utveckling. Motsvarande inställning i prod
# görs i dashboarden (Authentication → URL Configuration).
site_url = "https://stadsvandring.io/karta"
additional_redirect_urls = [
  "https://stadsvandring.io",
  "https://stadsvandring.io/**",
  # Wildcards även lokalt — utan /** matchar inte http://localhost:8090/karta.
  "http://localhost:8090",
  "http://localhost:8090/**",
  "http://127.0.0.1:8090",
  "http://127.0.0.1:8090/**"
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Google OAuth — fill GOOGLE_CLIENT_ID / GOOGLE_SECRET in the dashboard (or env for local).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[storage]
enabled = true

# ── Edge functions ───────────────────────────────────────────────────────────
# Betalningsfunktionerna (stripe-webhook, create-checkout, customer-portal) togs
# bort i community-omstarten. De låg kvar här och gav "no such file"-varningar
# vid varje supabase start.
[functions.enhance-content]
verify_jwt = true
