# Supabase CLI config for the Stadsvandring community-tips backend.
# Local dev:  supabase start && supabase db reset   (applies migrations)
# Hosted:     supabase link --project-ref <ref> && supabase db push
project_id = "stadsvandring"

[api]
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 15

[studio]
port = 55323

[inbucket]
port = 55324

[analytics]
enabled = false

[auth]
# Site URL + redirects for the live PWA. Add your local dev URL too if needed.
site_url = "https://stadsvandring.io"
additional_redirect_urls = [
  "https://stadsvandring.io",
  "https://stadsvandring.io/**",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:8090",
  "http://127.0.0.1:8090"
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Google OAuth — fill GOOGLE_CLIENT_ID / GOOGLE_SECRET in the dashboard (or env for local).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[storage]
enabled = true

# ── Edge functions (betalning) ───────────────────────────────────────────────
# Stripe-webhooken kan inte skicka en Supabase-JWT → stäng av JWT-verifiering för
# just den (signaturen verifieras i funktionen istället). checkout/portal kräver
# JWT (default) så bara inloggade konton når dem.
[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true

[functions.customer-portal]
verify_jwt = true
