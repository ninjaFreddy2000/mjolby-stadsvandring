name: Deploy to Vercel (production)

# Auto-deploy: varje push till main bygger och publicerar till stadsvandring.io.
# Ersätter Vercels inbyggda Git-integration (som krävde att Vercel-GitHub-appen
# installerades på repo-ägarkontot). Här deployar vi via Vercel CLI med en token
# i GitHub Actions-secrets istället — ingen kontokoppling behövs.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_VsbAv2D2I7PjStcEASw7z2cC
      VERCEL_PROJECT_ID: prj_EXWXnn4fsm3nMR8LIE9Jcr3jB1tP
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
